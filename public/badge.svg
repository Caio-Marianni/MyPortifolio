<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-6 -6 512 512">
  <style>
    path {
      fill: none;
      stroke: #FF5500;
      stroke-width: 10;
      stroke-linejoin: miter;
      stroke-miterlimit: 10;
      stroke-dasharray: 1;
      animation: drawFill 6s ease-in-out infinite;
    }
    @keyframes drawFill {
      0%, 5%    { stroke-dashoffset: 1; fill: rgba(255, 85, 0, 0) }
