      65%, 80% { stroke-dashoffset: 0; fill: rgba(255, 85, 0, 1) }
      90%, 100%    { stroke-dashoffset: 1; fill: rgba(255, 85, 0, 0) }
    }
    @media (prefers-reduced-motion: reduce) {
      path { animation: none; stroke-dashoffset: 0; fill: #FF5500 }
    }
  </style>
